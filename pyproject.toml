[project]
name = "jobagent"
version = "0.1.0"
description = "Twice-daily job crawler and ranker that emails one digest."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "google-api-python-client>=2.202.0",
    "google-auth>=2.63.1",
    "google-auth-oauthlib>=1.5.0",
    "httpx[http2]>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.59.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.4",
    "selectolax>=1.0.2",
    "sqlalchemy>=2.1.9",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "respx>=0.23.1",
    "pre-commit>=4.7.0",
    "types-pyyaml>=6.0.12.20261122",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
