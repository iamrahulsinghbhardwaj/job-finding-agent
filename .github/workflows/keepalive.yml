# GitHub disables scheduled workflows in public repos after 60 days without repository activity.
# Weekly, re-enable the run workflow and this one through the GitHub API (no dummy commits, no
# third-party action holding write access). Uses only this workflow's own GITHUB_TOKEN.
name: keepalive

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  actions: write  # enable workflows; nothing else

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Re-enable scheduled workflows
        run: |
          for workflow in run.yml keepalive.yml; do
            gh api --method PUT "repos/$REPO/actions/workflows/$workflow/enable" --silent
            echo "enabled $workflow"
          done
