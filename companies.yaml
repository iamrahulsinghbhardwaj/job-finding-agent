# Company registry. Tiers are set by hand (Rahul), never by code or the LLM.
# Schema: see Company / SourceConfig in src/jobagent/core/models.py.
# Check this file with: uv run python -m jobagent.jobs.registry

# What each tier's run searches for (HLD §4). Only sources that search server-side (Amazon) use
# it; board sources return the whole board. Keywords stay empty: titles are filtered locally.
search:
  T1:
    countries: [IN, IE, GB, NL, DE, CH, PL, SE, DK]  # India + the 8 Europe hub countries
    max_pages: 5  # hard cap per query (100 jobs a page on Amazon)
  T1_STARTUP:
    countries: []  # anywhere; startup boards are whole-board sources anyway
  OTHER:
    countries: [IN]

companies:
  - slug: microsoft
    name: Microsoft
    tier: T1
    india_presence: true
    europe_presence: true
    us_transfer_path: true
    sources:
      - platform: eightfold
        tenant: microsoft.com
        extra:
          host: apply.careers.microsoft.com
        status: blocked
        blocked_reason: "429 + HTML + Set-Cookie on first request, 2026-11-23"

  - slug: amazon
    name: Amazon
    tier: T1
    india_presence: true
    europe_presence: true
    us_transfer_path: true
    sources:
      - platform: amazon
        tenant: amazon.jobs
        extra:
          # always scoped: one search caps at 10,000 results; one query per country x category
          categories: [software-development, machine-learning-science]
        timeout_seconds: 600  # first full pass pages every country x category query

  - slug: stripe
    name: Stripe
    tier: T1
    india_presence: false
    europe_presence: true
    us_transfer_path: true
    sources:
      - platform: greenhouse
        tenant: stripe

  # Test entry for the Lever adapter (tier OTHER per brick 6). Office flags read from the board.
  - slug: palantir
    name: Palantir
    tier: OTHER
    india_presence: false
    europe_presence: true
    us_transfer_path: true
    sources:
      - platform: lever
        tenant: palantir

  # Test entry for the Ashby adapter (tier OTHER like palantir; may become T1 as an AI lab).
  - slug: openai
    name: OpenAI
    tier: OTHER
    india_presence: true
    europe_presence: true
    us_transfer_path: true
    sources:
      - platform: ashby
        tenant: openai

